name: Publish Docker image (Multi-arch)

on:
  push:
    tags:
      - '*'
      - '!nightly*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name to build (for example, v1.2.3)
        required: true
        type: string

env:
  IMAGE_NAME: chenyme/grok2api

jobs:
  build_single_arch:
    name: Build and push (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve tag and write VERSION
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            if ! git rev-parse --verify --quiet "refs/tags/$REQUESTED_TAG" >/dev/null; then
              echo "::error::Tag '$REQUESTED_TAG' does not exist"
              exit 1
            fi
            git checkout --detach "refs/tags/$REQUESTED_TAG"
            TAG="$REQUESTED_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if ! [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Tag '$TAG' is not a valid Docker image tag"
            exit 1
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$TAG" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push architecture image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.TAG }}-${{ matrix.arch }}
            ${{ env.IMAGE_NAME }}:latest-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign architecture image
        run: cosign sign --yes "$IMAGE_NAME@${{ steps.build.outputs.digest }}"

      - name: Write image summary
        run: |
          echo "### Docker image digest (${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE_NAME:$TAG-${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  create_manifests:
    name: Create and sign multi-architecture manifests
    needs: build_single_arch
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Set version
        run: echo "TAG=${{ needs.build_single_arch.outputs.tag }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create version manifest
        run: |
          docker buildx imagetools create \
            -t "$IMAGE_NAME:$TAG" \
            "$IMAGE_NAME:$TAG-amd64" \
            "$IMAGE_NAME:$TAG-arm64"

      - name: Create latest manifest
        run: |
          docker buildx imagetools create \
            -t "$IMAGE_NAME:latest" \
            "$IMAGE_NAME:latest-amd64" \
            "$IMAGE_NAME:latest-arm64"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign manifests
        run: |
          cosign sign --yes "$IMAGE_NAME:$TAG"
          cosign sign --yes "$IMAGE_NAME:latest"

      - name: Write manifest summary
        run: |
          echo "### Multi-architecture manifest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE_NAME:$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
